[project]
name = "planfix-mcp"
version = "0.1.0"
description = "Open-source stdio MCP server for Planfix CRM: in-process login and curated read-only domain tools"
readme = "README.md"
license = "MIT"
keywords = ["ai", "crm", "mcp", "planfix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
requires-python = "==3.14.*"
dependencies = [
    "mcp>=1.30,<2",
    "aiohttp>=3.14,<4",
    "playwright>=1.58,!=1.62.0,<2", # 1.62.0 leaks pending sync-Playwright tasks during interpreter shutdown.
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "orjson>=3.11,<4",
]

[project.scripts]
planfix-mcp = "planfix_mcp.mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planfix_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/LICENSE",
    "/README.en.md",
    "/README.md",
    "/docs/images/readme-capabilities.svg",
    "/pyproject.toml",
    "/run.py",
    "/setup.sh",
    "/src",
    "/tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15,<1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "ASYNC",
    "B",
    "Q",
    "T10",
    "T20",
    "SIM",
    "RUF",
]
ignore = [
    "Q000",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["planfix_mcp"]
omit = [
    "tests/*",
    "src/planfix_mcp/config.py",
    "src/planfix_mcp/mcp/server.py",
    "src/planfix_mcp/planfix/auth.py",
    "src/planfix_mcp/writes/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
