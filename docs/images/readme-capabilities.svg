        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.15px;
        fill: #F1F3F5;
      }
      .code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 10.5px;
        font-weight: 600;
